<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Você já estava descadastrado</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
            border: 1px solid #edf2f7;
        }

        .icone {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: #dcfce7;
            color: #166534;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;
            color: #1a202c;
            font-size: 1.5rem;
            font-weight: 700;
        }

        p {
            margin: 0 0 24px;
            color: #4a5568;
            font-size: 1rem;
            line-height: 1.5;
        }

        .rodape {
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
            font-size: 0.875rem;
            color: #a0aec0;
        }
    </style>
</head>

<body>

<div class="card">
    <div class="icone">✅</div>
    <h1>Você já estava descadastrado</h1>
    <p>Seu contato já havia sido removido da nossa lista.</p>
    <div class="rodape">
        Obrigado pelo seu tempo.
    </div>
</div>

</body>
</html>
