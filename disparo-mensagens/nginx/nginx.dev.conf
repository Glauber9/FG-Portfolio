upstream django {
    server disparo_django:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream evolution_api {
    server disparo_evolution:8080 max_fails=3 fail_timeout=30s;
}

upstream evolution_manager {
    server disparo_evolution_manager:80 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name localhost 127.0.0.1 seudominio.com;

    client_max_body_size 50M;

    gzip off;

    add_header X-Debug-Server "nginx-dev" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0" always;

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires -1;
    }

    location = /favicon.ico {
        return 204;
        access_log off;
    }

    location = /robots.txt {
        return 204;
        access_log off;
    }

    location /health/ {
        access_log off;
        proxy_set_header Host $host;
        proxy_pass http://django;
    }

    location /envios/webhook/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://django;
    }

    location /ws/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_pass http://django;
    }

    location /evolution-api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://evolution_api/;
    }

    location /evolution-manager/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_pass http://evolution_manager/;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_pass http://django;
    }

    access_log /var/log/nginx/access.log combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log debug;
}
